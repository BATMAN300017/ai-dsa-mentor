name: AI DSA Mentor CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  java-build-and-test:
    name: Java 21 & Maven Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and Test Maven Monorepo
        run: mvn -B verify

  frontend-build-and-check:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install and Build Frontend
        working-directory: apps/frontend
        run: |
          npm install
          npm run typecheck
          npm run build

  browser-extension-check:
    name: Browser Extension Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Manifest and Build Extension
        working-directory: apps/browser-extension
        run: |
          npm install
          npm run validate
          npm run build
